name: SteamSPA validation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and generated artifact
        shell: powershell
        run: .\tests\SmokeTests.ps1
