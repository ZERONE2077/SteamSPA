name: SteamSPA validation
on:
  workflow_dispatch:
    inputs:
      check:
        description: Run source and generated-artifact validation
        required: false
        default: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and generated artifact
        shell: powershell
        run: .\tests\SmokeTests.ps1
